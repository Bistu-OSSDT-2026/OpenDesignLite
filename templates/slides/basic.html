<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Design Lite Slides</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #161616;
        background: #f3f3f0;
      }
      section {
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 56px;
      }
      .slide {
        width: min(960px, 100%);
      }
    </style>
  </head>
  <body>
    <section>
      <div class="slide">
        <h1>Open Design Lite Slides</h1>
        <p>A lightweight HTML deck starter.</p>
      </div>
    </section>
  </body>
</html>
