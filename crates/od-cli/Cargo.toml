[package]
name = "od-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "odl"
path = "src/main.rs"

[dependencies]
od-core = { path = "../od-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
